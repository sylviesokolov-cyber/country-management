<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  VIEWPORT — every part of this line matters on a phone:
    width=device-width   : use the real screen width, not a fake 980px desktop
    initial-scale=1      : no zoom on load
    viewport-fit=cover   : draw under the notch / home bar. REQUIRED for the
                           env(safe-area-inset-*) padding in base.css to be
                           anything other than 0.
    user-scalable=no +
    maximum-scale=1      : pinch-zooming a game HUD only ever breaks it. (Note:
                           iOS Safari ignores these for accessibility reasons,
                           which is why we ALSO set touch-action: manipulation.)
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Mandate — a country-management strategy game.">
<!-- Lets the game run chrome-less when added to a phone home screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mandate</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/ui.css">
</head>
<body>

<!-- ===========================================================================
     THE APP SHELL: exactly three grid rows, pinned to the viewport.
     Nothing outside a .scrollable element ever scrolls.
     ======================================================================== -->
<div id="app">

  <!-- ---------------------------------------------------------------- TOP -->
  <header class="hud-top">
    <div class="resource-row">
      <div class="resource resource--treasury">
        <span class="resource__icon" aria-hidden="true">&#128176;</span>
        <div class="resource__body">
          <div class="resource__label">Treasury</div>
          <div class="resource__value" id="hud-treasury">0</div>
        </div>
      </div>
      <!-- Shown but not simulated until Phase 2. Kept in the HUD from day one
           so the layout never has to change shape later. -->
      <div class="resource resource--capital resource--pending" id="hud-capital-box">
        <span class="resource__icon" aria-hidden="true">&#127963;</span>
        <div class="resource__body">
          <div class="resource__label">Capital</div>
          <div class="resource__value" id="hud-capital">0</div>
        </div>
      </div>
      <div class="resource resource--manpower resource--pending" id="hud-manpower-box">
        <span class="resource__icon" aria-hidden="true">&#128101;</span>
        <div class="resource__body">
          <div class="resource__label">Manpower</div>
          <div class="resource__value" id="hud-manpower">0</div>
        </div>
      </div>
    </div>

    <div class="status-row">
      <div class="mandate">
        <div class="mandate__head">
          <span>Mandate</span>
          <span class="mandate__value" id="hud-mandate">100</span>
        </div>
        <div class="mandate__track" role="progressbar" aria-label="Mandate"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hud-mandate-track">
          <div class="mandate__fill" id="hud-mandate-fill"></div>
        </div>
      </div>

      <div class="clock">
        <div class="clock__date" id="hud-date">1 Jan 2027</div>
        <!-- Speed controls. data-speed maps straight onto state.speed. -->
        <div class="speed" role="group" aria-label="Game speed">
          <button class="speed__btn" data-speed="0" aria-pressed="false" aria-label="Pause">&#9208;</button>
          <button class="speed__btn" data-speed="1" aria-pressed="true"  aria-label="Normal speed">1&times;</button>
          <button class="speed__btn" data-speed="2" aria-pressed="false" aria-label="Double speed">2&times;</button>
        </div>
      </div>
    </div>
  </header>

  <!-- --------------------------------------------------------------- MAP -->
  <main class="map-layer" id="map-layer">
    <!-- The <svg> is built by src/ui/map.js from data/map-geometry.js.
         Nothing about the map is hardcoded in this file. -->
    <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet" role="group" aria-label="Country map"></svg>

    <!-- Region detail panel. Slides up over the map; the tab bar stays put. -->
    <section class="sheet" id="region-sheet" aria-hidden="true" aria-label="Region detail">
      <div class="sheet__head">
        <div>
          <div class="sheet__subtitle" id="region-terrain">&nbsp;</div>
          <div class="sheet__title" id="region-name">&nbsp;</div>
        </div>
        <button class="sheet__close" id="region-close" aria-label="Close region panel">&times;</button>
      </div>
      <div class="sheet__body scrollable" id="region-body"></div>
    </section>

    <!-- Bottom-tab panels (Tech / Appointees / Policies / Events). -->
    <section class="sheet" id="tab-sheet" aria-hidden="true" aria-label="Menu">
      <div class="sheet__head">
        <div>
          <div class="sheet__subtitle">Ministry</div>
          <div class="sheet__title" id="tab-title">&nbsp;</div>
        </div>
        <button class="sheet__close" id="tab-close" aria-label="Close panel">&times;</button>
      </div>
      <div class="sheet__body scrollable" id="tab-body"></div>
    </section>

    <!-- Phase 2 will show the run-over summary here. -->
    <div class="veil" id="veil">
      <div>
        <div class="sheet__title" id="veil-title">Run over</div>
        <p class="sheet__subtitle" id="veil-reason"></p>
      </div>
    </div>
  </main>

  <!-- ------------------------------------------------------------- BOTTOM -->
  <nav class="hud-bottom">
    <div class="tabs">
      <button class="tab" data-tab="tech"       aria-pressed="false"><span class="tab__icon" aria-hidden="true">&#9881;</span>Tech</button>
      <button class="tab" data-tab="appointees" aria-pressed="false"><span class="tab__icon" aria-hidden="true">&#128100;</span>Appointees</button>
      <button class="tab" data-tab="policies"   aria-pressed="false"><span class="tab__icon" aria-hidden="true">&#128220;</span>Policies</button>
      <button class="tab" data-tab="events"     aria-pressed="false"><span class="tab__icon" aria-hidden="true">&#10071;</span>Events</button>
    </div>
  </nav>
</div>

<!-- ===========================================================================
     SCRIPTS — plain <script> tags, loaded in dependency order, no build step.
     (Deliberately NOT ES modules: `type="module"` is blocked by CORS when you
     open index.html straight off the filesystem, which would break the
     "open the file on your phone and it just works" requirement. Each file
     instead attaches itself to one global `window.Mandate` namespace.)

     Order: data -> helpers -> simulation -> view -> boot.
     ======================================================================== -->
<script src="data/balance.js"></script>
<script src="data/map-geometry.js"></script>
<script src="data/regions.js"></script>

<script src="src/util.js"></script>
<script src="src/state.js"></script>
<script src="src/sim.js"></script>
<script src="src/loop.js"></script>

<script src="src/ui/view.js"></script>
<script src="src/ui/map.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/panel.js"></script>
<script src="src/ui/tabs.js"></script>

<script src="src/main.js"></script>
</body>
</html>
