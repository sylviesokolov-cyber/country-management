<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  VIEWPORT — every part of this line matters on a phone:
    width=device-width   : use the real screen width, not a fake 980px desktop
    initial-scale=1      : no zoom on load
    viewport-fit=cover   : draw under the notch / home bar. REQUIRED for the
                           env(safe-area-inset-*) padding in base.css to be
                           anything other than 0. In LANDSCAPE the notch is on
                           a side edge, so this matters more, not less.
    user-scalable=no +
    maximum-scale=1      : pinch-zooming a game HUD only ever breaks it. (Note:
                           iOS Safari ignores these for accessibility reasons,
                           which is why we ALSO set touch-action: manipulation.)
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Mandate — a country-management strategy game.">
<!-- Lets the game run chrome-less when added to a phone home screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mandate</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/ui.css">
</head>
<body>

<!-- Shown instead of the game when the viewport is portrait. The packaged
     Android app will lock to landscape in the manifest (Phase 6); this is the
     browser equivalent. -->
<div class="rotate-gate" id="rotate-gate">
  <div class="rotate-gate__icon" aria-hidden="true">&#128241;</div>
  <div>
    <div class="panel__title">Rotate your phone</div>
    <p class="panel__subtitle">Mandate is played in landscape</p>
  </div>
</div>

<!-- ===========================================================================
     THE APP SHELL — landscape, full-bleed.
     The map fills the screen; the HUD floats on top of it.
     ======================================================================== -->
<div id="app">

  <!-- ------------------------------------------------------- MAP (bottom) -->
  <div class="map-layer" id="map-layer">
    <!-- Built by src/ui/map.js from data/map-geometry.js. Nothing about the
         map is hardcoded in this file. -->
    <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet" role="group" aria-label="Country map"></svg>
  </div>

  <!-- ------------------------------------------------- HUD (floats above) -->
  <!-- This layer is click-through; only the controls inside it take taps, so
       you can still tap a region that sits visually beneath the HUD. -->
  <div class="hud">

    <!-- top-left: resource chips.
         All four live inside ONE glass card (.chip-group), not one pill each.
         If the row runs out of width it wraps INSIDE that shared card, so a
         wrapped second row still has a background behind it instead of
         floating loose pills over the map — that floating-pill look was the
         "wobbly" HUD bug on narrower landscape phones. -->
    <div class="hud-topleft chip-group glass">
      <!-- The Treasury rate is NET of upkeep, which is the only honest
           version of it: gross income that quietly loses to the upkeep bill
           would read as a healthy economy right up until the lights went out.
           The chip turns red when the bill is about to go unpaid. -->
      <div class="chip chip--treasury" id="hud-treasury-chip">
        <span class="chip__icon" aria-hidden="true">&#128176;</span>
        <span class="chip__value" id="hud-treasury">0</span>
        <span class="chip__rate" id="hud-treasury-rate">+0/d</span>
      </div>
      <div class="chip chip--capital">
        <span class="chip__icon" aria-hidden="true">&#127963;</span>
        <span class="chip__value" id="hud-capital">0</span>
        <span class="chip__rate" id="hud-capital-rate">+0/d</span>
      </div>
      <!-- Manpower shows its cap inline as "held/cap": unlike Treasury it
           fills up and stops, so how much room is left is as useful as how
           much there is. -->
      <div class="chip chip--manpower">
        <span class="chip__icon" aria-hidden="true">&#128101;</span>
        <span class="chip__value" id="hud-manpower">0</span>
        <span class="chip__rate" id="hud-manpower-rate">+0/d</span>
      </div>
      <div class="chip chip--stability">
        <span class="chip__icon" aria-hidden="true">&#9878;</span>
        <span class="chip__value" id="hud-stability">0%</span>
      </div>
    </div>

    <!-- top-right: fullscreen toggle, date, speed -->
    <div class="hud-topright clock glass">
      <!-- Browsers won't go fullscreen without a direct tap on something, so
           this is a real button rather than an automatic call. Hidden by CSS
           on browsers with no Fullscreen API (e.g. iOS Safari) — see
           src/main.js, which feature-detects before showing it. -->
      <button class="fullscreen-btn" id="btn-fullscreen" aria-label="Toggle fullscreen" hidden>
        <span aria-hidden="true">&#10021;</span>
      </button>
      <span class="clock__date" id="hud-date">1 Jan 2027</span>
      <!-- How far through the term. A run now has a far end as well as a near
         one, and a player who doesn't know the term is finite can't pace it.
         Filled in by src/ui/hud.js from BALANCE.mandate.termDays. -->
    <span class="clock__term" id="hud-term">Year 1 of 10</span>
    <!-- data-speed maps straight onto state.speed. -->
      <div class="speed" role="group" aria-label="Game speed">
        <button class="speed__btn" data-speed="0" aria-pressed="false" aria-label="Pause">&#9208;</button>
        <button class="speed__btn" data-speed="1" aria-pressed="true"  aria-label="Normal speed">1&times;</button>
        <button class="speed__btn" data-speed="2" aria-pressed="false" aria-label="Double speed">2&times;</button>
      </div>
    </div>

    <!-- right edge: vertical gauges -->
    <div class="hud-rail rail">
      <div class="gauge glass" role="progressbar" aria-label="Mandate"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hud-mandate-gauge">
        <span class="gauge__value" id="hud-mandate">100</span>
        <div class="gauge__track"><div class="gauge__fill" id="hud-mandate-fill"></div></div>
        <span class="gauge__label">Mandate</span>
      </div>
    </div>

    <!-- bottom-left: opens the full-screen management overlay -->
    <button class="hud-bottomleft corner-btn" id="btn-ministry">
      <span class="corner-btn__icon" aria-hidden="true">&#9881;</span>
      <span>Ministry</span>
    </button>

    <!-- bottom-right: opens the region list -->
    <button class="hud-bottomright corner-btn" id="btn-regions">
      <span>Regions</span>
      <span class="corner-btn__icon" aria-hidden="true">&#128506;</span>
    </button>
  </div>

  <!-- ------------------------------------------- REGION PANEL (right side) -->
  <section class="side-panel" id="region-panel" aria-hidden="true" aria-label="Region detail">
    <div class="panel__head">
      <div>
        <div class="panel__subtitle" id="region-terrain">&nbsp;</div>
        <div class="panel__title" id="region-name">&nbsp;</div>
      </div>
      <button class="panel__close" id="region-close" aria-label="Close region panel">&times;</button>
    </div>
    <div class="panel__body scrollable" id="region-body"></div>
  </section>

  <!-- ----------------------------------------------- FULL-SCREEN OVERLAY -->
  <!-- Tabs across the top, content below — the shape the reference games use
       for their management screens. -->
  <section class="overlay" id="overlay" aria-hidden="true" aria-label="Management">
    <div class="overlay__tabs" role="group" aria-label="Sections">
      <button class="overlay__tab" data-tab="tech"       aria-pressed="false"><span class="overlay__tab-icon" aria-hidden="true">&#9881;</span>Tech</button>
      <button class="overlay__tab" data-tab="appointees" aria-pressed="false"><span class="overlay__tab-icon" aria-hidden="true">&#128100;</span>Appointees</button>
      <button class="overlay__tab" data-tab="policies"   aria-pressed="false"><span class="overlay__tab-icon" aria-hidden="true">&#128220;</span>Policies</button>
      <button class="overlay__tab" data-tab="events"     aria-pressed="false"><span class="overlay__tab-icon" aria-hidden="true">&#10071;</span>Events</button>
      <button class="overlay__tab" data-tab="regions"    aria-pressed="false"><span class="overlay__tab-icon" aria-hidden="true">&#128506;</span>Regions</button>
      <button class="overlay__close" id="overlay-close" aria-label="Close">&times;</button>
    </div>
    <div class="overlay__body scrollable" id="overlay-body"></div>
  </section>

  <!-- ----------------------------------------------------- EVENT (Phase 4) -->
  <!-- A branching choice, over everything else, with the clock stopped. It has
       to interrupt: a decision read while sixteen regions drift is a reflex
       test, not a decision. Built entirely by src/ui/events.js. -->
  <div class="veil veil--event" id="event-veil">
    <div class="veil__card event-card">
      <div class="event-card__day" id="event-day"></div>
      <div class="veil__title" id="event-title"></div>
      <p class="event-card__text" id="event-text"></p>
      <div class="event-card__choices" id="event-choices"></div>
    </div>
  </div>

  <!-- ------------------------------------------------- RUN OVER (Phase 4) -->
  <!-- Built once when the run ends (see src/main.js). A run now ends one of
       two ways — the term served, or the Mandate gone — and this screen reads
       very differently for each. -->
  <div class="veil" id="veil">
    <div class="veil__card">
      <div class="veil__title" id="veil-title">Your term is over</div>
      <p class="veil__reason" id="veil-reason"></p>
      <div class="veil__score" id="veil-score"></div>
      <dl class="veil__stats" id="veil-stats"></dl>
      <div class="veil__buttons">
        <button class="veil__restart" id="veil-restart">Choose a new leader</button>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------ LEADER SELECT (P4) -->
  <!-- The first thing a new run shows. Built by src/ui/leaders.js from
       data/leaders.js — this file has no idea how many leaders there are. -->
  <div class="veil veil--leaders is-open" id="leader-veil">
    <div class="leader-select">
      <div class="leader-select__head">
        <div class="veil__title">Who takes office?</div>
        <p class="panel__subtitle">One term. Ten years. Sixteen regions that
          have heard it all before.</p>
      </div>
      <div class="leader-grid" id="leader-grid"></div>
    </div>
  </div>
</div>

<!-- ===========================================================================
     SCRIPTS — plain <script> tags, loaded in dependency order, no build step.
     (Deliberately NOT ES modules: `type="module"` is blocked by CORS when you
     open index.html straight off the filesystem, which would break the
     "open the file on your phone and it just works" requirement. Each file
     instead attaches itself to one global `window.Mandate` namespace.)

     Order: data -> helpers -> simulation -> view -> boot.
     ======================================================================== -->
<script src="data/balance.js"></script>
<script src="data/map-geometry.js"></script>
<script src="data/regions.js"></script>
<!-- Phase 3 content: the tech tree, appointee traits and the hiring pool's raw
     material, and the standing policies. All pure data, no logic. -->
<script src="data/tech.js"></script>
<script src="data/traits.js"></script>
<script src="data/appointees.js"></script>
<script src="data/policies.js"></script>
<!-- Phase 4: who you are, and what the country does about it. -->
<script src="data/leaders.js"></script>
<script src="data/events.js"></script>

<script src="src/util.js"></script>
<script src="src/state.js"></script>
<!-- modifiers.js MUST come before sim.js: the sim captures Mandate.Mods at
     load time, and it is what turns tech/appointees/policies into numbers. -->
<script src="src/modifiers.js"></script>
<script src="src/sim.js"></script>
<script src="src/loop.js"></script>

<script src="src/ui/view.js"></script>
<script src="src/ui/map.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/panel.js"></script>
<script src="src/ui/ministry.js"></script>
<script src="src/ui/events.js"></script>
<script src="src/ui/leaders.js"></script>
<script src="src/ui/overlay.js"></script>
<script src="src/ui/fullscreen.js"></script>

<script src="src/main.js"></script>
</body>
</html>
